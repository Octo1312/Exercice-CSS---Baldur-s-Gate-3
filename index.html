<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="nav">
            <img class="logo-bg3" src="assets/img/img/logo-bg3.png" alt="Logo Baldur's Gate 3">
            <nav>
                <ul class="nav-link">
                    <li><a href="">About</a></li>
                    <li><a href="">Races</a></li>

                </ul>
            </nav>
        </div>

    <main>
        <section class="partytime">
            <video class="herovideo" muted loop playsinline>
                <source src="assets/video/videos/hero-bg.mp4" type="video/mp4">
            </video>
            <div class="herocontent">
                <h1>IT'S PARTY TIME</h1>
                <a href="" class="hero__btn">GET IT NOW!</a>

        </section>
        <section class="awardsandraces">
            <div class="awards">
                <div class="awardtitle">
                    <h3>BALDUR'S GATE </h3>
                    <h2>AWARDS</h2>
                </div>
                    <img class="awardlogo" src="assets/img/img/1.png" alt="awards1">
                    <img class="awardlogo" src="assets/img/img/2.png" alt="awards2">
                    <img class="awardlogo" src="assets/img/img/3.png" alt="awards3">
                    <img class="awardlogo" src="assets/img/img/4.png" alt="awards4">      
            </div>
            <h2>GAMES RACES</h2>
            <div class="racesandpresentation">
                <div class="races">
                    <img class="raceslogo" src="assets/img/img/elf.png" alt="logo elf">
                    <img class="raceslogo" src="assets/img/img/tiefling.png" alt="logo tiefling">
                    <img class="raceslogo" src="assets/img/img/drow.png" alt="logo drow">
                    <img class="raceslogo" src="assets/img/img/human.png" alt="logo human">
                    <img class="raceslogo" src="assets/img/img/githyanki.png" alt="logo githyanki">
                    <img class="raceslogo" src="assets/img/img/dwarf.png" alt="logo dwarf">
                    <img class="raceslogo" src="assets/img/img/half-elf.png" alt="logo half-elf">
                    <img class="raceslogo" src="assets/img/img/halfling.png" alt="logo halfling">
                    <img class="raceslogo" src="assets/img/img/gnome.png" alt="logo gnome">
                    <img class="raceslogo" src="assets/img/img/half-orc.png" alt="logo half-orc">
                    <img class="raceslogo" src="assets/img/img/dragonborn.png" alt="logo dragonborn">
                </div>
                <div class="racespresentation">
               <div class="presentation">
                <img src="assets/img/img/elf.png" alt="logo elf">
                <h2>ELF</h2>
                <p>With ethereal countenances and long lifespans, elves are at home with nature's power, flourishing in light and dark alike.</p>
               </div>
            </div>
            </div>
        </section>
