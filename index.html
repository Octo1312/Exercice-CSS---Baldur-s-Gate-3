<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <div class="nav">
            <img class="logo-bg3" src="assets/img/img/logo-bg3.png" alt="Logo Baldur's Gate 3">
            <nav>
                <ul class="nav-link">
                    <li><a href="">About</a></li>
                    <li><a href="">Races</a></li>
                    <li><a href="">News</a></li>
                    <li><a href="">Gallery</a></li>
                    <li><a class="btn" href="">Buy Now</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="partytime">
            <video class="herovideo" muted loop playsinline>
                <source src="assets/video/videos/hero-bg.mp4" type="video/mp4">
            </video>
            <div class="herocontent">
                <h1>IT'S PARTY TIME</h1>
                <a href="" class="hero-btn">GET IT NOW!</a>
            </div>
        </section>
        <section class="awards-container">
            <div class="awards">
                <div class="award-title">
                    <h3>BALDUR'S GATE 3 </h3>
                    <h2> AWARDS</h2>
                    </div>
                    <div class="awards-image">
                        <img class="awardlogo" src="assets/img/img/1.png" alt="awards1">
                        <img class="awardlogo" src="assets/img/img/2.png" alt="awards2">
                        <img class="awardlogo" src="assets/img/img/3.png" alt="awards3">
                        <img class="awardlogo" src="assets/img/img/4.png" alt="awards4">
                    </div>      
                </div>
            </div>    
        </section>
        <section id="races">
            <div class="container">
                <h2>GAME RACES</h2>
                <div class="races-container">
                    <div class="races-list">
                        <div class="races-item">
                            <img src="assets/img/img/elf.png" alt="Logo Elf">
                            <h3>Elf</h3>
                        </div>
                        <div class="races-item">
                            <img src="assets/img/img/tiefling.png" alt="Logo Tiefling">
                            <h3>Tiefling</h3>
                        </div>
                        <div class="races-item">
                            <img src="assets/img/img/drow.png" alt="Logo Drow">
                            <h3>Drow</h3>
                        </div>
                        <div class="races-item">
                            <img src="assets/img/img/human.png" alt="Logo Human">
                            <h3>Human</h3>
                        </div>
                        <div class="races-item">
                            <img src="assets/img/img/githyanki.png" alt="Logo Githyanki">
                            <h3>Githyanki</h3>
                        </div>
                        <div class="races-item">
                            <img src="assets/img/img/dwarf.png" alt="Logo Dwarf">
                            <h3>Dwarf</h3>
                        </div>
                        <div class="races-item">
                            <img src="assets/img/img/half-elf.png" alt="Logo Half-Elf">
                            <h3>Half-Elf</h3>
                        </div>
                        <div class="races-item">
                            <img src="assets/img/img/halfling.png" alt="Logo Halfling">
                            <h3>Halfling</h3>
                        </div>
                        <div class="races-item">
                            <img src="assets/img/img/gnome.png" alt="Logo Gnome">
                            <h3>Gnome</h3>
                        </div>
                        <div class="races-item">
                            <img src="assets/img/img/half-orc.png" alt="Logo Half-Orc">
                            <h3>Half-Orc</h3>
                        </div>
                        <div class="races-item">
                            <img src="assets/img/img/dragonborn.png" alt="Logo Dragonborn">
                            <h3>Dragonborn</h3>
                        </div>
                    </div>
                    <div class="races-presentation">
                    
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
